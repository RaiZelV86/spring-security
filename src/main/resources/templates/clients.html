<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>List of clients</title>
</head>
<body>
<h2>Clients</h2>
<a th:href="@{/clients/new}">Add client</a>
<table border="1">
  <thead>
  <tr>
    <th>ID</th><th>Surname</th><th>Lastname</th><th>Email</th><th>Age</th><th>Action</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="client : ${clients}">
    <td th:text="${client.id}"></td>
    <td th:text="${client.userName}"></td>
    <td th:text="${client.lastName}"></td>
    <td th:text="${client.email}"></td>
    <td th:text="${client.age}"></td>
    <td>
      <a th:href="@{'/clients/edit/' + ${client.id}}">Edit✏️</a> |
      <a th:href="@{'/clients/delete/' + ${client.id}}"
         onclick="return confirm('Удалить клиента?')">Delete🗑️</a>
    </td>
  </tr>
  </tbody>
</table>

<form th:action="@{/logout}" method="post" style="margin-top: 20px;">
  <button type="submit">Exit</button>
</form>
</body>
</html>
